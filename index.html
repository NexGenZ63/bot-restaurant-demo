<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Le Botaniste — Assistant IA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #c8a96e;
    --accent2: #e8c98e;
    --text: #f0ede8;
    --text-muted: #7a7570;
    --text-soft: #a09890;
    --radius: 18px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  /* ── MOBILE : plein écran chat ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--surface);
  }

  /* Header */
  .chat-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }

  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8a6a3e);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }

  .chat-header-info h3 {
    font-family: 'Playfair Display', serif;
    font-size: 16px; font-weight: 400; color: var(--text);
  }
  .chat-header-info p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4caf82; margin-left: auto;
    box-shadow: 0 0 8px rgba(76,175,130,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Quick access bar */
  .quick-bar {
    display: flex; gap: 8px;
    padding: 10px 14px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .quick-bar::-webkit-scrollbar { display: none; }

  .qbtn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-soft);
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .qbtn:hover, .qbtn:active {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Messages */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 3px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg { display: flex; gap: 8px; align-items: flex-end; animation: msgIn 0.25s ease; }
  .msg.user { flex-direction: row-reverse; }
  @keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8a6a3e);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0;
  }
  .msg-avatar.user-av {
    background: linear-gradient(135deg, #444, #222);
    font-size: 10px; color: var(--text-muted);
  }

  .msg-wrap { display: flex; flex-direction: column; max-width: 78%; }
  .msg.user .msg-wrap { align-items: flex-end; }

  .msg-bubble {
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
    font-weight: 300;
  }
  .msg.bot .msg-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-soft);
    border-bottom-left-radius: 4px;
  }
  .msg.user .msg-bubble {
    background: var(--accent);
    color: #1a1208;
    border-bottom-right-radius: 4px;
    font-weight: 400;
  }
  .msg-time { font-size: 10px; color: var(--text-muted); margin-top: 3px; padding: 0 3px; }
  .msg.user .msg-time { text-align: right; }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip:hover, .chip:active { background: var(--accent); color: #1a1208; }

  /* Typing */
  .typing { display: flex; align-items: center; gap: 4px; padding: 12px 14px; }
  .typing-dot {
    width: 6px; height: 6px; background: var(--text-muted);
    border-radius: 50%; animation: tdot 1.2s infinite;
  }
  .typing-dot:nth-child(2){animation-delay:.2s}
  .typing-dot:nth-child(3){animation-delay:.4s}
  @keyframes tdot { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }

  /* Input */
  .chat-input-area {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
    background: var(--surface);
    flex-shrink: 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .chat-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 11px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .chat-input::placeholder { color: var(--text-muted); }
  .chat-input:focus { border-color: var(--accent); }

  .send-btn {
    width: 44px; height: 44px;
    background: var(--accent);
    border: none; border-radius: 50%;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:active { transform: scale(0.93); }
  .send-btn svg { width: 17px; height: 17px; fill: #1a1208; }

  /* Forms */
  .form-msg { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .form-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; display: block; }
  .form-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-submit {
    background: var(--accent); border: none; border-radius: 8px;
    padding: 11px; color: #1a1208;
    font-size: 13px; font-family: 'DM Sans', sans-serif;
    font-weight: 500; cursor: pointer; margin-top: 4px;
    transition: background 0.2s;
  }
  .form-submit:active { background: var(--accent2); }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="chat-header">
    <div class="avatar">🌿</div>
    <div class="chat-header-info">
      <h3>Le Botaniste</h3>
      <p>Assistant · Réservations · Menu</p>
    </div>
    <div class="status-dot"></div>
  </div>

  <!-- Quick bar -->
  <div class="quick-bar">
    <button class="qbtn" onclick="sendQuick('Voir la carte')">🍽️ Carte</button>
    <button class="qbtn" onclick="sendQuick('Réserver une table')">📅 Réserver</button>
    <button class="qbtn" onclick="sendQuick('Vos horaires ?')">🕐 Horaires</button>
    <button class="qbtn" onclick="sendQuick('Je veux être contacté')">✉️ Contact</button>
    <button class="qbtn" onclick="sendQuick('Infos parking')">🚗 Accès</button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="messages"></div>

  <!-- Input -->
  <div class="chat-input-area">
    <input class="chat-input" id="userInput" type="text" placeholder="Posez votre question…" onkeydown="handleKey(event)" />
    <button class="send-btn" onclick="handleSend()">
      <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

</div>
<script>
const now = () => new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

const responses = {
  greet: {
    text: `Bonsoir et bienvenue chez **Le Botaniste** ! 🌿\n\nJe suis votre assistant. Comment puis-je vous aider ?`,
    chips: ['Voir la carte','Réserver une table','Horaires & infos','Être rappelé']
  },
  carte: {
    text: `🍽️ **Notre carte du moment**\n\n**Entrées**\n· Velouté de butternut, noisettes — 12€\n· Tartare de bœuf, câpres — 16€\n· Burrata, tomates rôties — 14€\n\n**Plats**\n· Filet de bar, beurre blanc — 28€\n· Magret de canard, miel & figues — 26€\n· Risotto de saison, parmesan — 22€\n\n**Desserts**\n· Tarte Tatin, crème fraîche — 9€\n· Crème brûlée vanille — 8€\n\n**Formule déjeuner** : Entrée + Plat + Dessert à 34€`,
    chips: ['Réserver une table','Infos allergènes','Autre question']
  },
  horaires: {
    text: `🕐 **Horaires d'ouverture**\n\nMar – Ven : 12h–14h30 & 19h–22h30\nSamedi : 12h–15h & 19h–23h\nDim & Lun : Fermé\n\n📍 14 rue des Abbesses, Paris 18e\n📞 01 42 XX XX XX`,
    chips: ['Réserver une table','Voir la carte']
  },
  allergenes: {
    text: `⚠️ **Allergènes & régimes**\n\nOptions disponibles :\n· Sans gluten ✓\n· Végétarien ✓\n· Végétalien (sur demande) ✓\n\nPour allergie sévère, appelez-nous : **01 42 XX XX XX**`,
    chips: ['Réserver une table','Voir la carte']
  },
  parking: {
    text: `🚗 **Accès & stationnement**\n\n· Métro Abbesses (ligne 12) — 2 min\n· Parking Square des Batignolles — 5 min\n· Vélib' — 100m\n\n📍 14 rue des Abbesses, Paris 18e`,
    chips: ['Réserver une table','Autre question']
  }
};

function addMsg(content, sender, chips=null, form=null) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${sender}`;

  const formatted = content.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');

  const chipsHtml = chips
    ? `<div class="chips">${chips.map(c=>`<button class="chip" onclick="sendQuick('${c}')">${c}</button>`).join('')}</div>`
    : '';

  let formHtml = '';
  if (form === 'resa') {
    formHtml = `<div class="form-msg" id="resaForm">
      <div><label class="form-label">Prénom & nom</label><input class="form-input" id="resaNom" placeholder="Marie Dupont"/></div>
      <div><label class="form-label">Date</label><input class="form-input" id="resaDate" type="date"/></div>
      <div><label class="form-label">Heure</label><input class="form-input" id="resaHeure" placeholder="20h00"/></div>
      <div><label class="form-label">Nombre de couverts</label><input class="form-input" id="resaCouv" placeholder="2"/></div>
      <div><label class="form-label">Téléphone</label><input class="form-input" id="resaTel" placeholder="06 XX XX XX XX"/></div>
      <button class="form-submit" onclick="submitResa()">Confirmer →</button>
    </div>`;
  }
  if (form === 'lead') {
    formHtml = `<div class="form-msg" id="leadForm">
      <div><label class="form-label">Prénom</label><input class="form-input" id="leadNom" placeholder="Thomas"/></div>
      <div><label class="form-label">Téléphone ou email</label><input class="form-input" id="leadContact" placeholder="06 XX / mail@…"/></div>
      <div><label class="form-label">Votre demande</label><input class="form-input" id="leadObjet" placeholder="Événement privé…"/></div>
      <button class="form-submit" onclick="submitLead()">Envoyer →</button>
    </div>`;
  }

  const isBot = sender === 'bot';
  div.innerHTML = `
    <div class="msg-avatar ${isBot?'':'user-av'}">${isBot?'🌿':'Vs'}</div>
    <div class="msg-wrap">
      <div class="msg-bubble">${formatted}${chipsHtml}${formHtml}</div>
      <span class="msg-time">${now()}</span>
    </div>`;

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing-indicator';
  div.innerHTML = `<div class="msg-avatar">🌿</div><div class="msg-wrap"><div class="msg-bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() { const t=document.getElementById('typing-indicator'); if(t) t.remove(); }

function botReply(text, chips=null, form=null) {
  showTyping();
  setTimeout(() => { removeTyping(); addMsg(text,'bot',chips,form); }, 800+Math.random()*400);
}

function sendQuick(text) { addMsg(text,'user'); processInput(text.toLowerCase()); }

function handleSend() {
  const inp = document.getElementById('userInput');
  const val = inp.value.trim(); if(!val) return;
  addMsg(val,'user'); inp.value = '';
  processInput(val.toLowerCase());
}

function handleKey(e) { if(e.key==='Enter') handleSend(); }

function processInput(input) {
  if(input.includes('réserv')||input.includes('table')) { botReply(`📅 **Réservation**\n\nAvec plaisir ! Remplissez le formulaire, confirmation par SMS sous 1h.`,null,'resa'); return; }
  if(input.includes('carte')||input.includes('menu')||input.includes('plat')||input.includes('manger')) { botReply(responses.carte.text,responses.carte.chips); return; }
  if(input.includes('horaire')||input.includes('ouvert')||input.includes('heure')||input.includes('fermé')) { botReply(responses.horaires.text,responses.horaires.chips); return; }
  if(input.includes('allergi')||input.includes('gluten')||input.includes('végétar')||input.includes('vegan')) { botReply(responses.allergenes.text,responses.allergenes.chips); return; }
  if(input.includes('parking')||input.includes('accès')||input.includes('métro')||input.includes('adresse')) { botReply(responses.parking.text,responses.parking.chips); return; }
  if(input.includes('contact')||input.includes('rappel')||input.includes('rappelé')||input.includes('événement')||input.includes('privatis')) { botReply(`✉️ **Être recontacté**\n\nLaissez vos coordonnées, nous vous rappelons rapidement.`,null,'lead'); return; }
  if(input.includes('prix')||input.includes('combien')||input.includes('tarif')) { botReply(`💶 **Tarifs**\n\nFormule déjeuner : **34€**\nMenu dégustation : **65€**\nPlats le soir : **22€ – 30€**`,['Voir la carte','Réserver une table']); return; }
  botReply(`Merci ! 🌿 Je peux vous renseigner sur notre **carte**, nos **horaires**, ou vous aider à **réserver**.`,['Voir la carte','Réserver une table','Horaires & infos','Être rappelé']);
}

function submitResa() {
  const nom=document.getElementById('resaNom')?.value;
  const date=document.getElementById('resaDate')?.value;
  const heure=document.getElementById('resaHeure')?.value;
  const couv=document.getElementById('resaCouv')?.value;
  const tel=document.getElementById('resaTel')?.value;
  if(!nom||!date||!heure||!couv||!tel){alert('Merci de remplir tous les champs.');return;}
  const dateF=new Date(date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('resaForm').innerHTML=`<p style="color:#4caf82;font-size:13px;">✓ Formulaire envoyé</p>`;
  setTimeout(()=>{ botReply(`✅ **Réservation confirmée !**\n\nMerci **${nom}** !\n· ${dateF} à ${heure}\n· ${couv} couverts\n· Contact : ${tel}\n\nConfirmation par SMS dans 1h. À bientôt ! 🌿`,['Voir la carte','Autre question']); },600);
}

function submitLead() {
  const nom=document.getElementById('leadNom')?.value;
  const contact=document.getElementById('leadContact')?.value;
  if(!nom||!contact){alert("Merci d'indiquer votre prénom et contact.");return;}
  document.getElementById('leadForm').innerHTML=`<p style="color:#4caf82;font-size:13px;">✓ Demande envoyée</p>`;
  setTimeout(()=>{ botReply(`📬 **Demande reçue !**\n\nMerci **${nom}**, nous vous recontactons via **${contact}** dans les 24h. 🌿`,['Voir la carte','Réserver une table']); },600);
}

// Init — démarre immédiatement
addMsg(responses.greet.text,'bot',responses.greet.chips);
</script>
</body>
</html>
