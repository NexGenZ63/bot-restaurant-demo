<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Botaniste — Assistant IA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #c8a96e;
    --accent2: #e8c98e;
    --text: #f0ede8;
    --text-muted: #7a7570;
    --text-soft: #a09890;
    --bot-bg: #1e1e1e;
    --user-bg: #c8a96e;
    --radius: 18px;
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* Subtle background grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 40px;
    align-items: flex-start;
    max-width: 1100px;
    width: 100%;
  }

  /* LEFT PANEL */
  .left-panel {
    flex: 0 0 300px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding-top: 10px;
  }

  .restaurant-brand {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .restaurant-tag {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }

  .restaurant-name {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.1;
  }

  .restaurant-sub {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 300;
    margin-top: 4px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--accent);
    opacity: 0.5;
  }

  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .info-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .info-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .info-value {
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 400;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(200, 169, 110, 0.12);
    border: 1px solid rgba(200, 169, 110, 0.25);
    color: var(--accent);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .badge::before { content: '●'; font-size: 7px; }

  .quick-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .quick-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }

  .quick-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-soft);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .quick-btn:hover {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(200, 169, 110, 0.06);
  }

  .quick-btn span { font-size: 15px; }

  /* CHAT WIDGET */
  .chat-widget {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    height: 620px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  }

  .chat-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8a6a3e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .chat-header-info h3 {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--text);
  }

  .chat-header-info p {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4caf82;
    margin-left: auto;
    box-shadow: 0 0 8px rgba(76, 175, 130, 0.5);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8a6a3e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }

  .msg-bubble {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
    font-weight: 300;
  }

  .msg.bot .msg-bubble {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    color: var(--text-soft);
    border-bottom-left-radius: 4px;
  }

  .msg.user .msg-bubble {
    background: var(--user-bg);
    color: #1a1208;
    border-bottom-right-radius: 4px;
    font-weight: 400;
  }

  .msg-time {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    padding: 0 4px;
  }

  .msg.user .msg-time { text-align: right; }

  .msg-wrap { display: flex; flex-direction: column; }
  .msg.user .msg-wrap { align-items: flex-end; }

  /* Chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
  }

  .chip {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 400;
  }

  .chip:hover {
    background: var(--accent);
    color: #1a1208;
  }

  /* Typing indicator */
  .typing { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
  .typing-dot {
    width: 6px; height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: typing 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input */
  .chat-input-area {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--surface);
  }

  .chat-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 16px;
    color: var(--text);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
  }

  .chat-input::placeholder { color: var(--text-muted); }
  .chat-input:focus { border-color: var(--accent); }

  .send-btn {
    width: 42px;
    height: 42px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: var(--accent2); transform: scale(1.05); }
  .send-btn svg { width: 16px; height: 16px; fill: #1a1208; }

  /* Form styles */
  .form-msg {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 6px;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .form-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .form-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .form-input:focus { border-color: var(--accent); }

  .form-submit {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 10px;
    color: #1a1208;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s;
  }

  .form-submit:hover { background: var(--accent2); }

  @media (max-width: 768px) {
    .page-wrapper { flex-direction: column; }
    .left-panel { flex: none; width: 100%; }
    .chat-widget { height: 500px; }
  }
</style>
</head>
<body>

<div class="page-wrapper">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="restaurant-brand">
      <span class="restaurant-tag">Restaurant</span>
      <h1 class="restaurant-name">Le Botaniste</h1>
      <p class="restaurant-sub">Cuisine française & bistronomie</p>
    </div>

    <div class="divider"></div>

    <div class="info-card">
      <div class="info-row">
        <div class="info-icon">🕐</div>
        <div>
          <div class="info-label">Horaires</div>
          <div class="info-value">Mar–Sam · 12h–14h30 · 19h–22h30</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">📍</div>
        <div>
          <div class="info-label">Adresse</div>
          <div class="info-value">14 rue des Abbesses, Paris 18e</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">💶</div>
        <div>
          <div class="info-label">Menu déjeuner</div>
          <div class="info-value">Formule à partir de 24€</div>
        </div>
      </div>
    </div>

    <div><span class="badge">Disponible maintenant</span></div>

    <div class="quick-actions">
      <div class="quick-label">Accès rapide</div>
      <button class="quick-btn" onclick="sendQuick('Voir la carte')"><span>🍽️</span> Voir la carte</button>
      <button class="quick-btn" onclick="sendQuick('Réserver une table')"><span>📅</span> Réserver une table</button>
      <button class="quick-btn" onclick="sendQuick('Vos horaires ?')"><span>🕐</span> Horaires & infos</button>
      <button class="quick-btn" onclick="sendQuick('Je veux être contacté')"><span>✉️</span> Être rappelé</button>
    </div>
  </div>

  <!-- CHAT WIDGET -->
  <div class="chat-widget">
    <div class="chat-header">
      <div class="avatar">🌿</div>
      <div class="chat-header-info">
        <h3>Assistant Le Botaniste</h3>
        <p>Réservations · Informations · Menu</p>
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="chat-input-area">
      <input class="chat-input" id="userInput" type="text" placeholder="Posez votre question…" onkeydown="handleKey(event)" />
      <button class="send-btn" onclick="handleSend()">
        <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
const BOT_NAME = "Le Botaniste";
const now = () => new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});

// State
let state = 'idle';
let leadData = {};
let resaData = {};

// Bot responses logic
const responses = {
  greet: {
    text: `Bonsoir et bienvenue chez **Le Botaniste** ! 🌿\n\nJe suis votre assistant. Comment puis-je vous aider ce soir ?`,
    chips: ['Voir la carte', 'Réserver une table', 'Horaires & infos', 'Être rappelé']
  },
  carte: {
    text: `🍽️ **Notre carte du moment**\n\n**Entrées**\n· Velouté de butternut, noisettes torréfiées — 12€\n· Tartare de bœuf, câpres & cornichons — 16€\n· Burrata, tomates rôties & basilic — 14€\n\n**Plats**\n· Filet de bar, beurre blanc & légumes croquants — 28€\n· Magret de canard, miel & figues — 26€\n· Risotto de saison, parmesan 24 mois — 22€\n\n**Desserts**\n· Tarte Tatin, crème fraîche — 9€\n· Crème brûlée à la vanille — 8€\n\n**Formule déjeuner** : Entrée + Plat + Dessert à 34€`,
    chips: ['Réserver une table', 'Infos allergènes', 'Autre question']
  },
  horaires: {
    text: `🕐 **Horaires d'ouverture**\n\nMardi – Vendredi : 12h–14h30 & 19h–22h30\nSamedi : 12h–15h & 19h–23h\nDimanche & Lundi : Fermé\n\n📍 14 rue des Abbesses, 75018 Paris\n📞 01 42 XX XX XX\n\nSouhaitez-vous réserver une table ?`,
    chips: ['Réserver une table', 'Voir la carte', 'Autre question']
  },
  allergenes: {
    text: `⚠️ **Allergènes & régimes spéciaux**\n\nNous proposons des options :\n· Sans gluten ✓\n· Végétarien ✓\n· Végétalien (sur demande) ✓\n\nNotre cuisine contient des produits pouvant contenir : gluten, lactose, fruits à coque, œufs, poisson.\n\nPour toute allergie sévère, merci de nous appeler directement au **01 42 XX XX XX**.`,
    chips: ['Réserver une table', 'Voir la carte']
  },
  parking: {
    text: `🚗 **Accès & stationnement**\n\nNous sommes facilement accessibles :\n· Métro : Abbesses (ligne 12) à 2 min à pied\n· Parking public : Square des Batignolles à 5 min\n· Vélib' : Station à 100m\n\nL'adresse exacte : **14 rue des Abbesses, Paris 18e**`,
    chips: ['Réserver une table', 'Autre question']
  }
};

function addMsg(content, sender, hasChips = null, isForm = null) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${sender}`;

  const avatarHtml = sender === 'bot'
    ? `<div class="msg-avatar">🌿</div>`
    : `<div class="msg-avatar" style="background:linear-gradient(135deg,#555,#333);font-size:11px">Vous</div>`;

  const formattedText = content
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');

  let chipsHtml = '';
  if (hasChips) {
    chipsHtml = `<div class="chips">${hasChips.map(c => `<button class="chip" onclick="sendQuick('${c}')">${c}</button>`).join('')}</div>`;
  }

  let formHtml = '';
  if (isForm === 'resa') {
    formHtml = `
      <div class="form-msg" id="resaForm">
        <div class="form-field"><label class="form-label">Votre prénom & nom</label><input class="form-input" id="resaNom" placeholder="Ex : Marie Dupont" /></div>
        <div class="form-field"><label class="form-label">Date souhaitée</label><input class="form-input" id="resaDate" type="date" /></div>
        <div class="form-field"><label class="form-label">Heure</label><input class="form-input" id="resaHeure" placeholder="Ex : 20h00" /></div>
        <div class="form-field"><label class="form-label">Nombre de couverts</label><input class="form-input" id="resaCouv" placeholder="Ex : 2" /></div>
        <div class="form-field"><label class="form-label">Téléphone</label><input class="form-input" id="resaTel" placeholder="06 XX XX XX XX" /></div>
        <button class="form-submit" onclick="submitResa()">Confirmer la réservation →</button>
      </div>`;
  }
  if (isForm === 'lead') {
    formHtml = `
      <div class="form-msg" id="leadForm">
        <div class="form-field"><label class="form-label">Votre prénom</label><input class="form-input" id="leadNom" placeholder="Ex : Thomas" /></div>
        <div class="form-field"><label class="form-label">Téléphone ou email</label><input class="form-input" id="leadContact" placeholder="06 XX / mail@…" /></div>
        <div class="form-field"><label class="form-label">Objet de votre demande</label><input class="form-input" id="leadObjet" placeholder="Événement privé, question…" /></div>
        <button class="form-submit" onclick="submitLead()">Envoyer ma demande →</button>
      </div>`;
  }

  div.innerHTML = `
    ${avatarHtml}
    <div class="msg-wrap">
      <div class="msg-bubble">${formattedText}${chipsHtml}${formHtml}</div>
      <span class="msg-time">${now()}</span>
    </div>`;

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-avatar">🌿</div>
    <div class="msg-wrap">
      <div class="msg-bubble">
        <div class="typing">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function botReply(text, chips = null, form = null) {
  showTyping();
  setTimeout(() => {
    removeTyping();
    addMsg(text, 'bot', chips, form);
  }, 900 + Math.random() * 400);
}

function sendQuick(text) {
  addMsg(text, 'user');
  processInput(text.toLowerCase());
}

function handleSend() {
  const inp = document.getElementById('userInput');
  const val = inp.value.trim();
  if (!val) return;
  addMsg(val, 'user');
  inp.value = '';
  processInput(val.toLowerCase());
}

function handleKey(e) {
  if (e.key === 'Enter') handleSend();
}

function processInput(input) {
  // Réservation
  if (input.includes('réserv') || input.includes('reserver') || input.includes('table') || input.includes('booking')) {
    botReply(`📅 **Réservation en ligne**\n\nAvec plaisir ! Remplissez le formulaire ci-dessous et nous confirmons par SMS sous 1h.`, null, 'resa');
    return;
  }
  // Carte / menu
  if (input.includes('carte') || input.includes('menu') || input.includes('plat') || input.includes('manger')) {
    botReply(responses.carte.text, responses.carte.chips);
    return;
  }
  // Horaires
  if (input.includes('horaire') || input.includes('ouvert') || input.includes('fermé') || input.includes('heure')) {
    botReply(responses.horaires.text, responses.horaires.chips);
    return;
  }
  // Allergènes
  if (input.includes('allergi') || input.includes('gluten') || input.includes('végétar') || input.includes('vegan')) {
    botReply(responses.allergenes.text, responses.allergenes.chips);
    return;
  }
  // Parking / accès
  if (input.includes('parking') || input.includes('accès') || input.includes('métro') || input.includes('adresse')) {
    botReply(responses.parking.text, responses.parking.chips);
    return;
  }
  // Lead / contact
  if (input.includes('contact') || input.includes('rappel') || input.includes('rappelé') || input.includes('événement') || input.includes('privatiser') || input.includes('privé')) {
    botReply(`✉️ **Être recontacté**\n\nLaissez-nous vos coordonnées et nous vous rappelons dans les meilleurs délais.`, null, 'lead');
    return;
  }
  // Prix
  if (input.includes('prix') || input.includes('combien') || input.includes('tarif') || input.includes('€')) {
    botReply(`💶 **Nos tarifs**\n\nFormule déjeuner : **34€** (Entrée + Plat + Dessert)\nMenu dégustation : **65€** (6 services)\nCarte le soir : entre **22€ et 30€** pour un plat principal\n\nBoissons non comprises. Voir la carte complète ?`, ['Voir la carte', 'Réserver une table']);
    return;
  }
  // Default
  botReply(`Merci pour votre message ! 🌿\n\nJe peux vous renseigner sur notre **carte**, nos **horaires**, ou vous aider à **réserver une table**. Que souhaitez-vous ?`, ['Voir la carte', 'Réserver une table', 'Horaires & infos', 'Être rappelé']);
}

function submitResa() {
  const nom = document.getElementById('resaNom')?.value;
  const date = document.getElementById('resaDate')?.value;
  const heure = document.getElementById('resaHeure')?.value;
  const couv = document.getElementById('resaCouv')?.value;
  const tel = document.getElementById('resaTel')?.value;

  if (!nom || !date || !heure || !couv || !tel) {
    alert('Merci de remplir tous les champs.');
    return;
  }

  const dateFormatted = new Date(date).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});

  document.getElementById('resaForm').innerHTML = `<p style="color:#4caf82;font-size:13px;">✓ Formulaire envoyé</p>`;

  setTimeout(() => {
    botReply(`✅ **Réservation enregistrée !**\n\nMerci **${nom}** ! Voici le récapitulatif :\n\n· **Date** : ${dateFormatted} à ${heure}\n· **Couverts** : ${couv} personnes\n· **Contact** : ${tel}\n\nNous vous confirmons par SMS d'ici 1h. À très bientôt ! 🌿`, ['Voir la carte', 'Autre question']);
  }, 600);
}

function submitLead() {
  const nom = document.getElementById('leadNom')?.value;
  const contact = document.getElementById('leadContact')?.value;
  const objet = document.getElementById('leadObjet')?.value;

  if (!nom || !contact) {
    alert('Merci d\'indiquer au moins votre prénom et contact.');
    return;
  }

  document.getElementById('leadForm').innerHTML = `<p style="color:#4caf82;font-size:13px;">✓ Demande envoyée</p>`;

  setTimeout(() => {
    botReply(`📬 **Demande reçue !**\n\nMerci **${nom}**, nous avons bien noté votre demande.\n\nNous vous recontactons via **${contact}** dans les 24h.\n\nÀ très bientôt ! 🌿`, ['Voir la carte', 'Réserver une table']);
  }, 600);
}

  botReply(responses.greet.text, responses.greet.chips);
}, 500);
